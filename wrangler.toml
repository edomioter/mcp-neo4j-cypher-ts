# MCP Neo4j Cypher Server - Cloudflare Workers Configuration
name = "mcp-neo4j-cypher"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
account_id = "e1a6f9414e9b47f056d1731ab791f4db"

# Development settings
[dev]
port = 8787
local_protocol = "http"

# Environment variables (non-sensitive)
[vars]
ENVIRONMENT = "development"
DEFAULT_READ_TIMEOUT = "30"
DEFAULT_TOKEN_LIMIT = "10000"
DEFAULT_SCHEMA_SAMPLE = "1000"
ALLOWED_ORIGINS = "https://claude.ai,https://www.claude.ai"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "mcp-neo4j-users"
database_id = "placeholder-replace-with-actual-id"

# KV Namespace binding
[[kv_namespaces]]
binding = "SESSIONS"
id = "placeholder-replace-with-actual-id"

# ============================================
# Development Environment
# ============================================
[env.dev]
name = "mcp-neo4j-cypher-dev"

[env.dev.vars]
ENVIRONMENT = "dev"
DEFAULT_READ_TIMEOUT = "30"
DEFAULT_TOKEN_LIMIT = "10000"
DEFAULT_SCHEMA_SAMPLE = "1000"
ALLOWED_ORIGINS = "https://claude.ai,https://www.claude.ai"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "mcp-neo4j-users-dev"
database_id = "e8e6fc3f-673a-4698-a4d7-8fe964cd87ae"

[[env.dev.kv_namespaces]]
binding = "SESSIONS"
id = "29f46c6580a34c0e9af149901e0e1101"

# ============================================
# Staging Environment
# ============================================
[env.staging]
name = "mcp-neo4j-cypher-staging"

[env.staging.vars]
ENVIRONMENT = "staging"
DEFAULT_READ_TIMEOUT = "30"
DEFAULT_TOKEN_LIMIT = "10000"
DEFAULT_SCHEMA_SAMPLE = "1000"
ALLOWED_ORIGINS = "https://claude.ai,https://www.claude.ai"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "mcp-neo4j-users-staging"
database_id = "86365e3f-ce97-4708-be5f-1dec9830055f"

[[env.staging.kv_namespaces]]
binding = "SESSIONS"
id = "e6434d88904c4f09b457d934841719ac"

# ============================================
# Production Environment
# ============================================
[env.production]
name = "mcp-neo4j-cypher"

[env.production.vars]
ENVIRONMENT = "production"
DEFAULT_READ_TIMEOUT = "30"
DEFAULT_TOKEN_LIMIT = "10000"
DEFAULT_SCHEMA_SAMPLE = "1000"
ALLOWED_ORIGINS = "https://claude.ai,https://www.claude.ai"

[[env.production.d1_databases]]
binding = "DB"
database_name = "mcp-neo4j-users-prod"
database_id = "5493f001-14a4-496a-bfc5-60a24ceb7101"

[[env.production.kv_namespaces]]
binding = "SESSIONS"
id = "babfaa9da1d147069b6a0e2b7328c2ca"

# ============================================
# Secrets (configure via wrangler secret put)
# ============================================
# ENCRYPTION_KEY - AES-256 key for encrypting Neo4j credentials
# Run: openssl rand -base64 32 | wrangler secret put ENCRYPTION_KEY
